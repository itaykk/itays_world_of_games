<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; font-family: sans-serif; background: #222; color: white; }
        canvas { background: #87CEEB; border: 4px solid white; display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>תפוס את התפוח!</h1>
    <p>הזז את הסלסילה שמאלה וימינה כדי לתפוס את התפוחים הנופלים.</p>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let basketX = 160;
        let basketWidth = 80;
        let appleX = Math.random() * 360;
        let appleY = 0;
        let appleSpeed = 4;
        let score = 0;

        // מקשי החיצים להזזת הסלסילה
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" && basketX > 0) {
                basketX -= 25;
            }
            if (e.key === "ArrowRight" && basketX < canvas.width - basketWidth) {
                basketX += 25;
            }
        });

        function update() {
            // התפוח נופל למטה
            appleY += appleSpeed;

            // בדיקה אם התפוח הגיע לתחתית המסך
            if (appleY > canvas.height - 30) {
                // בדיקה אם הסלסילה תפסה את התפוח
                if (appleX > basketX && appleX < basketX + basketWidth) {
                    score++;
                    appleSpeed += 0.2; // המשחק נהיה קצת יותר מהיר
                } else {
                    score = 0; // פוספוס - הניקוד מתאפס
                    appleSpeed = 4;
                }
                
                // החזרת התפוח למעלה במיקום אקראי חדש
                appleY = 0;
                appleX = Math.random() * (canvas.width - 20);
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ציור הניקוד
            ctx.fillStyle = "black";
            ctx.font = "20px Arial";
            ctx.fillText("נקודות: " + score, 10, 30);

            // ציור התפוח (עיגול אדום)
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(appleX + 10, appleY + 10, 12, 0, Math.PI * 2);
            ctx.fill();

            // ציור הסלסילה (מלבן חום)
            ctx.fillStyle = "#8B4513";
            ctx.fillRect(basketX, canvas.height - 25, basketWidth, 20);
        }

        update();
    </script>
</body>
</html>
