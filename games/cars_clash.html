<!DOCTYPE html>
<html>
<head>
    <style>
        body { text-align: center; font-family: sans-serif; background: #333; color: white; }
        canvas { background: #555; border: 4px solid white; display: block; margin: 20px auto; }
    </style>
</head>
<body>
    <h1>מרוץ מכוניות במקלדת</h1>
    <p>השתמש במקשי החיצים (ימינה ושמאלה) כדי להתרחק מהמכשולים!</p>
    <canvas id="gameCanvas" width="300" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let carX = 130;
        let obstacleX = Math.random() * 240;
        let obstacleY = -50;
        let score = 0;
        let gameOver = false;

        // הקשבה למקשי החיצים
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" && carX > 0) carX -= 20;
            if (e.key === "ArrowRight" && carX < 260) carX += 20;
        });

        function update() {
            if (gameOver) return;

            // הזזת המכשול למטה
            obstacleY += 5;

            // כשהמכשול יוצא מהמסך - יצירת מכשול חדש
            if (obstacleY > 400) {
                obstacleY = -50;
                obstacleX = Math.floor(Math.random() * 240);
                score++;
            }

            // בדיקת התנגשות
            if (obstacleY + 40 > 320 && obstacleY < 360 && Math.abs(carX - obstacleX) < 30) {
                gameOver = true;
                alert("המשחק נגמר! הניקוד שלך: " + score);
                location.reload();
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ציור המכונית שלך (כחולה)
            ctx.fillStyle = "cyan";
            ctx.fillRect(carX, 320, 40, 50);

            // ציור המכשול (אדום)
            ctx.fillStyle = "red";
            ctx.fillRect(obstacleX, obstacleY, 40, 40);

            // ציור הניקוד
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("ניקוד: " + score, 10, 30);
        }

        update();
    </script>
</body>
</html>
