<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guess the Number</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #8bd3dd, #b8f2e6);
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2b2c34;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 2rem;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    text-align: center;
    max-width: 320px;
  }
  input {
    font-size: 1.1rem;
    padding: 0.5rem;
    width: 5rem;
    text-align: center;
    border-radius: 10px;
    border: 2px solid #8bd3dd;
  }
  button {
    font-size: 1.1rem;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    border: none;
    background: #f582ae;
    color: white;
    font-weight: 700;
    cursor: pointer;
    margin-left: 0.5rem;
  }
  #message {
    margin-top: 1rem;
    min-height: 1.5rem;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🔢 Guess the Number</h1>
    <p>I'm thinking of a number between 1 and 100!</p>
    <input id="guess" type="number" min="1" max="100" />
    <button id="guess-btn">Guess</button>
    <p id="message"></p>
    <p id="tries"></p>
  </div>
  <script>
    let target = Math.floor(Math.random() * 100) + 1;
    let tries = 0;
    const input = document.getElementById('guess');
    const message = document.getElementById('message');
    const triesEl = document.getElementById('tries');

    document.getElementById('guess-btn').addEventListener('click', () => {
      const guess = Number(input.value);
      if (!guess || guess < 1 || guess > 100) {
        message.textContent = 'Enter a number between 1 and 100!';
        return;
      }
      tries++;
      if (guess === target) {
        message.textContent = `🎉 You got it in ${tries} tries! Refresh to play again.`;
      } else if (guess < target) {
        message.textContent = '📈 Higher!';
      } else {
        message.textContent = '📉 Lower!';
      }
      triesEl.textContent = `Tries: ${tries}`;
    });
  </script>
</body>
</html>
